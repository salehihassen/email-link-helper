name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    name: Tests, browser bundles and container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm ci --ignore-scripts
      - name: Check CI security policy and source syntax
        run: |
          python scripts/check-ci.py
          python -m compileall -q app.py helper manage.py relay.py scripts
          npm run check:js
      - name: Test backend and browser behavior
        run: |
          python -m pytest -q
          npm test
      - name: Build and lint browser bundles
        run: |
          python scripts/package-extensions.py
          npm run check:extensions
      - name: Build production container
        run: docker build --tag email-link-helper:ci .
